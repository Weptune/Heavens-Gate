<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="1.0"/>
    </radialGradient>
    <linearGradient id="goldPearl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="etherealGlow">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Midnight Sky -->
  <rect width="1024" height="1024" fill="#050814"/>
  <circle cx="512" cy="540" r="480" fill="url(#bgGlow)"/>

  <!-- Celestial Archway Threshold -->
  <path d="M 260 772 L 260 552 A 260 330 0 0 1 764 552 L 764 772" fill="none" stroke="url(#goldPearl)" stroke-width="16" stroke-linecap="round" filter="url(#etherealGlow)"/>
  <path d="M 275 772 L 275 552 A 240 310 0 0 1 749 552 L 749 772" fill="none" stroke="#F8FAFC" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  <line x1="212" y1="772" x2="812" y2="772" stroke="url(#goldPearl)" stroke-width="10" stroke-linecap="round"/>

  <!-- Smooth Flowing Ethereal Chess King -->
  <g filter="url(#etherealGlow)">
    <!-- Cross Top -->
    <rect x="505" y="334" width="14" height="44" rx="7" fill="#FFFFFF"/>
    <rect x="492" y="350" width="40" height="14" rx="7" fill="#FFFFFF"/>
    <circle cx="512" cy="334" r="7" fill="#FEF08A"/>

    <!-- Smooth Spherical Crown -->
    <circle cx="512" cy="402" r="28" fill="#FEF08A"/>
    <circle cx="512" cy="402" r="18" fill="#FFFFFF"/>
    <circle cx="422" cy="407" r="20" fill="url(#skyGrad)"/>
    <circle cx="602" cy="407" r="20" fill="url(#skyGrad)"/>
    <circle cx="462" cy="432" r="15" fill="#7DD3FC"/>
    <circle cx="562" cy="432" r="15" fill="#7DD3FC"/>

    <!-- Concentric Halo Rings -->
    <circle cx="512" cy="592" r="140" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.6"/>
    <circle cx="512" cy="592" r="90" fill="none" stroke="#FEF08A" stroke-width="2" stroke-opacity="0.7"/>
  </g>
</svg>
