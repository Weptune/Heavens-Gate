<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0B0D13" stop-opacity="1.0"/>
    </radialGradient>
    <linearGradient id="platGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="sapphireGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Titanium Space Canvas -->
  <rect width="1024" height="1024" fill="#0B0D13"/>
  <circle cx="512" cy="540" r="460" fill="url(#bgGlow)"/>

  <!-- Celestial Platinum Archway Threshold -->
  <path d="M 247 762 L 247 542 A 270 340 0 0 1 777 542 L 777 762" fill="none" stroke="url(#platGrad)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 261 762 L 261 542 A 252 322 0 0 1 763 542 L 763 762" fill="none" stroke="url(#sapphireGrad)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="212" y1="762" x2="812" y2="762" stroke="url(#platGrad)" stroke-width="8" stroke-linecap="round"/>

  <!-- Faceted Vector Grandmaster Emblem -->
  <g filter="url(#glow)">
    <polygon points="512,302 482,332 372,422 472,432" fill="#1E3A8A" fill-opacity="0.8" stroke="#E2E8F0" stroke-width="2"/>
    <polygon points="512,302 472,432 532,442 602,362" fill="#0284C7" fill-opacity="0.7" stroke="#E2E8F0" stroke-width="2"/>
    <polygon points="602,362 532,442 542,532 642,462" fill="#0E7490" fill-opacity="0.7" stroke="#E2E8F0" stroke-width="2"/>
    <polygon points="372,422 402,512 482,502 472,432" fill="#38BDF8" fill-opacity="0.6" stroke="#E2E8F0" stroke-width="2"/>
    <polygon points="472,432 482,502 432,632 512,562" fill="#1E3A8A" fill-opacity="0.85" stroke="#E2E8F0" stroke-width="2"/>
    <polygon points="482,502 642,462 632,632 512,562" fill="#0F172A" fill-opacity="0.9" stroke="#E2E8F0" stroke-width="2"/>
    <polygon points="432,632 632,632 672,752 352,752" fill="#0B1324" fill-opacity="0.95" stroke="#38BDF8" stroke-width="3"/>
  </g>
</svg>
