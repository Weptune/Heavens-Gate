<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#1E3A8A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0A0D14" stop-opacity="1.0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Midnight Slate Background -->
  <rect width="1024" height="1024" fill="#0A0D14"/>
  <circle cx="512" cy="512" r="480" fill="url(#bgGlow)"/>

  <!-- Celestial Gothic Archway ("Heaven's Gate") -->
  <g filter="url(#softGlow)">
    <line x1="282" y1="352" x2="282" y2="772" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round"/>
    <line x1="742" y1="352" x2="742" y2="772" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round"/>
    <path d="M 282 357 A 460 420 0 0 1 512 237" fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round"/>
    <path d="M 742 357 A 460 420 0 0 0 512 237" fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round"/>

    <!-- Inner Ivory Accent Frame -->
    <line x1="300" y1="362" x2="300" y2="772" stroke="#FAFAFA" stroke-width="4" opacity="0.9"/>
    <line x1="724" y1="362" x2="724" y2="772" stroke="#FAFAFA" stroke-width="4" opacity="0.9"/>
    <path d="M 300 362 A 424 405 0 0 1 512 247" fill="none" stroke="#FAFAFA" stroke-width="4" opacity="0.9"/>
    <path d="M 724 362 A 424 405 0 0 0 512 247" fill="none" stroke="#FAFAFA" stroke-width="4" opacity="0.9"/>

    <!-- Threshold Base -->
    <line x1="242" y1="772" x2="782" y2="772" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Iconic Grandmaster Chess Knight Silhouette -->
  <g filter="url(#softGlow)">
    <polygon points="502,322 487,352 537,332 587,382 617,462 627,552 637,662 387,662 407,592 427,532 397,472 382,432 432,402 472,362" fill="#0F172A" stroke="url(#goldGrad)" stroke-width="3"/>
    <line x1="502" y1="322" x2="472" y2="402" stroke="#FDE68A" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="472" y1="402" x2="382" y2="432" stroke="#FDE68A" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="472" y1="402" x2="482" y2="502" stroke="#FDE68A" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="482" y1="502" x2="407" y2="592" stroke="#FDE68A" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="482" y1="502" x2="562" y2="462" stroke="#FDE68A" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="562" y1="462" x2="587" y2="382" stroke="#FDE68A" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="562" y1="462" x2="627" y2="552" stroke="#FDE68A" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="482" y1="502" x2="522" y2="662" stroke="#FDE68A" stroke-width="2" stroke-opacity="0.6"/>
    <circle cx="458" cy="418" r="6" fill="#FFFFFF"/>
  </g>
</svg>
