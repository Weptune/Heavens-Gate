<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heaven's Gate Chess</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Navbar -->
    <header class="navbar">
        <div class="brand">
            <div class="brand-icon">🏛️</div>
            <div class="brand-title">HEAVEN'S GATE</div>
            <span class="badge">Spectral Engine</span>
        </div>
        <div class="nav-status">
            <span class="status-dot" id="status-dot"></span>
            <span id="engine-status">Engine Ready</span>
        </div>
    </header>

    <!-- Clean Focused Layout -->
    <main class="app-layout">
        
        <!-- Board Section -->
        <section class="board-area">
            <div class="board-container">
                <!-- Evaluation Bar -->
                <div class="eval-bar">
                    <div class="eval-fill" id="eval-fill"></div>
                    <span class="eval-val" id="eval-val">+0.0</span>
                </div>

                <!-- 2D Chessboard -->
                <div class="board" id="board"></div>
            </div>

            <!-- Controls Toolbar -->
            <div class="toolbar">
                <button class="btn btn-primary" id="new-game-btn">🔄 New Game</button>
                <button class="btn btn-secondary" id="flip-btn">🔄 Flip Board</button>
                <div class="select-group">
                    <label>Depth:</label>
                    <select id="depth-select">
                        <option value="4">Depth 4 (Fast)</option>
                        <option value="7">Depth 7 (Standard)</option>
                        <option value="9" selected>Depth 9 (Grandmaster)</option>
                        <option value="12">Depth 12 (Full Power)</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- Right Side: Clean Game Panel -->
        <aside class="sidebar">
            <div class="panel-card">
                <div class="panel-header">
                    <span>⚔️ Live Game Match</span>
                </div>
                <div class="player-bar">
                    <div class="avatar">🏛️</div>
                    <div class="player-info">
                        <div class="player-name">Heaven's Gate AI</div>
                        <div class="player-sub">Spectral-Tropical Engine</div>
                    </div>
                </div>
            </div>

            <!-- Move History -->
            <div class="panel-card flex-1">
                <div class="panel-header">
                    <span>📜 Move History</span>
                </div>
                <div class="move-history" id="move-history"></div>
            </div>
        </aside>

    </main>

    <script src="app.js"></script>
</body>
</html>
